contract:
  pdf:
    libreoffice-command: ${CONTRACT_PDF_LIBREOFFICE_COMMAND:soffice}

spring:
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:50MB}
  application:
    name: rental-room-management
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  config:
    # Load secrets from be/.env (gitignored); real env vars still take precedence.
    # Second path covers running from the parent folder (IDE opened at repo root).
    import:
      - optional:file:.env[.properties]
      - optional:file:be/.env[.properties]
  mongodb:
    uri: ${MONGODB_URI}
    database: ${MONGODB_DATABASE:rental_room_management}
  data:
    mongodb:
      auto-index-creation: true
    web:
      pageable:
        # ?page=1 is the first page, matching PagedResponse.number
        one-indexed-parameters: true
        default-page-size: 20
        max-page-size: 100

server:
  port: ${SERVER_PORT:8080}
  # Enable only behind a trusted proxy that strips incoming Forwarded headers.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

app:
  cloudinary:
    cloud-name: ${CLOUD_NAME:}
    api-key: ${CLOUD_API_KEY:}
    api-secret: ${CLOUD_SECRET_KEY:}
    # Default folder for uploads (a request may pass a sub folder)
    folder: ${CLOUD_FOLDER:rental-room-management}
  seed:
    auth:
      enabled: ${AUTH_SEED_ENABLED:false}
    # Extra tenant account tenant2@tropro.com (password = AUTH_SEED_PASSWORD), created only when missing.
    demo-tenant:
      enabled: ${DEMO_TENANT_SEED_ENABLED:false}
    services:
      enabled: ${SERVICE_SEED_ENABLED:false}
    # Wipes and rebuilds all electricity meter readings (last 6 months). Turn off after one run.
    meter-readings:
      enabled: ${METER_SEED_ENABLED:false}
    rooms:
      enabled: ${ROOM_SEED_ENABLED:false}
      # Empty = oldest ACTIVE branch
      branch-id: ${ROOM_SEED_BRANCH_ID:}
  security:
    jwt-secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:rental-room-management}
    audience: ${JWT_AUDIENCE:rental-room-api}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    require-https: ${REQUIRE_HTTPS:false}
    public-docs: ${PUBLIC_API_DOCS:true}
  auth:
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    mail-from: ${SMTP_FROM:no-reply@rentalroom.com}
    verification-token-ttl: ${EMAIL_VERIFICATION_TTL:24h}
    resend-cooldown: ${EMAIL_RESEND_COOLDOWN:60s}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  url: ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment/vnpay-return}
  api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}

service-request:
  # Local development only, until the contract module exposes a tenant's active tenancy:
  # every tenant is treated as renting this room (and slot). Keep disabled elsewhere.
  tenancy-stub:
    enabled: ${SERVICE_REQUEST_TENANCY_STUB_ENABLED:false}
    room-id: ${SERVICE_REQUEST_TENANCY_STUB_ROOM_ID:}
    room-slot-id: ${SERVICE_REQUEST_TENANCY_STUB_ROOM_SLOT_ID:}
